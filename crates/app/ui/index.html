<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RuskWatcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side">
  <div class="brand">RuskWatcher</div>
  <nav id="nav"></nav>
  <p id="status" data-i18n="status.loading"></p>
</aside>
<main>
  <div class="content">
    <header class="page-head">
      <span id="page-icon"></span>
      <h1 id="page-title"></h1>
      <select id="range">
        <option value="900" data-i18n="range.900"></option>
        <option value="3600" data-i18n="range.3600" selected></option>
        <option value="21600" data-i18n="range.21600"></option>
        <option value="86400" data-i18n="range.86400"></option>
        <option value="604800" data-i18n="range.604800"></option>
        <option value="2592000" data-i18n="range.2592000"></option>
      </select>
    </header>
    <div id="banner" class="banner hidden" role="status"></div>

    <section id="overview"><div class="charts" id="charts"></div></section>

    <section id="apps" class="hidden">
      <div class="card"><h2 data-i18n="title.apps"></h2><p class="note" data-i18n="note.apps"></p><table id="apps-table"></table></div>
    </section>

    <section id="findings" class="hidden">
      <div class="card"><h2 data-i18n="title.findings"></h2><table id="ftable"></table></div>
    </section>

    <section id="startup" class="hidden">
      <div class="card"><h2 data-i18n="title.startup"></h2><table id="stable"></table></div>
      <div class="card"><h2 data-i18n="title.changes"></h2><table id="ctable"></table></div>
      <div class="card"><h2 data-i18n="title.boots"></h2><table id="btable"></table></div>
    </section>

    <section id="drives" class="hidden">
      <div class="card"><h2 data-i18n="title.drives"></h2><table id="dtable"></table></div>
    </section>

    <section id="settings" class="hidden">
      <div class="card">
        <h2 data-i18n="settings.appearance"></h2>
        <label class="field"><span data-i18n="settings.theme"></span>
          <select id="theme">
            <option value="system" data-i18n="settings.theme.system"></option>
            <option value="light" data-i18n="settings.theme.light"></option>
            <option value="dark" data-i18n="settings.theme.dark"></option>
          </select>
        </label>
      </div>
      <div class="card">
        <h2 data-i18n="settings.language"></h2>
        <label class="field"><span data-i18n="settings.language"></span> <select id="language"></select></label>
      </div>
      <div class="card">
        <h2 data-i18n="svc.title"></h2>
        <p class="note" data-i18n="svc.intro"></p>
        <p><span data-i18n="svc.status"></span> <b id="svc-state">…</b></p>
        <label class="check"><input type="checkbox" id="svc-auto" disabled> <span data-i18n="svc.auto"></span></label>
        <button type="button" id="svc-run" class="btn" data-i18n="svc.start" disabled></button>
        <p id="svc-msg" class="dim" aria-live="polite"></p>
        <p class="note"><span data-i18n="svc.adminHint"></span> <span data-i18n="svc.dataFile"></span> <span class="db-path">–</span></p>
      </div>
    </section>

    <section id="about" class="hidden">
      <div class="card">
        <h2>RuskWatcher</h2>
        <p data-i18n="about.description"></p>
        <dl>
          <dt data-i18n="about.version"></dt><dd id="about-version">–</dd>
          <dt data-i18n="about.collector"></dt><dd data-i18n="about.collectorRole"></dd>
          <dt data-i18n="about.window"></dt><dd data-i18n="about.windowRole"></dd>
          <dt data-i18n="about.dataFile"></dt><dd class="db-path">–</dd>
          <dt data-i18n="about.license"></dt><dd>MIT</dd>
          <dt data-i18n="about.publisher"></dt><dd>zhmdff</dd>
        </dl>
      </div>
    </section>
  </div>
</main>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="table.js"></script>
<script src="app.js"></script>
</body>
</html>
